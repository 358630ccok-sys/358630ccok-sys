name: Daily activity digest
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update public digest
        run: |
          mkdir -p digests
          echo "# Lab digest $(date -u +%F)" > "digests/$(date -u +%F).md"
          echo "- Automated public activity update (no private data)." >> "digests/$(date -u +%F).md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests
          git diff --cached --quiet || git commit -m "chore: daily digest $(date -u +%F)"
          git push
